services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: uwati
      POSTGRES_USER: uwati
      POSTGRES_PASSWORD: uwati
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uwati -d uwati"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: valkey/valkey:9.1.1-alpine3.24
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

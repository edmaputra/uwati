services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: uwati
      POSTGRES_USER: uwati
      POSTGRES_PASSWORD: uwati
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uwati -d uwati"]
      interval: 10s
      timeout: 5s
      retries: 5

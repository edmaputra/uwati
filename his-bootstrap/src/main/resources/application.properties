spring.application.name=uwati
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/uwati}
spring.datasource.username=${JDBC_DATABASE_USERNAME:uwati}
spring.datasource.password=${JDBC_DATABASE_PASSWORD:uwati}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.json
